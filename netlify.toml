[build]
  publish = "."
  # ATENÇÃO: o antigo `ignore = "exit 0"` fazia o Netlify PULAR todo build de
  # git push (exit 0 = "sem mudanças"). Removido — agora há Netlify Functions
  # que precisam de build/bundle (npm install roda por causa do package.json).

# Backend gratuito (substitui as Cloud Functions — projeto segue no Spark)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rede de segurança do process-avistamento (a cada 6 horas)
[functions."sweep-avistamentos"]
  schedule = "0 */6 * * *"

# North Star: auto-confirmação de reuniões após 7 dias (diário, 08h UTC ≈ 05h BRT)
[functions."auto-confirmar-reunioes"]
  schedule = "0 8 * * *"

# PWA: redirecionar tudo para index.html (SPA routing via hash)
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Headers de segurança e cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), camera=(self), microphone=()"
    # [FIX C1+C2] CSP consolidada apenas no header HTTP (removido <meta> do index.html).
    # Origens adicionadas: nominatim (geocoding), firebasestorage (downloads),
    # identitytoolkit + securetoken (Firebase Auth), *.openstreetmap.org (tiles),
    # *.firebaseapp.com em connect (auth redirects).
    Content-Security-Policy = "default-src 'self' https://*.firebaseapp.com https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseapp.com https://*.googleapis.com https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://firebasestorage.googleapis.com https://*.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self' https://*.firebaseio.com https://*.firebaseapp.com https://*.googleapis.com https://firestore.googleapis.com https://firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com https://*.cloudfunctions.net https://cdn.jsdelivr.net https://nominatim.openstreetmap.org wss://*.firebaseio.com wss://*.googleapis.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self';"

# Service Worker — nunca cachear no edge
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest PWA
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# JS/CSS: revalidar sempre (ETag → 304, quase sem banda). Antes era
# "immutable" por 1 ano, mas app.js/db.js/auth.js são servidos sem ?v= —
# quem já tinha o app ficava com o JS antigo após cada deploy (e o SW
# re-precacheava a cópia velha do cache HTTP).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
