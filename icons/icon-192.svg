<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E55A2B"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Paw print -->
  <g transform="translate(96,88) scale(1.1)" fill="white">
    <!-- Main pad -->
    <ellipse cx="0" cy="18" rx="22" ry="18"/>
    <!-- Toe pads -->
    <ellipse cx="-18" cy="-8" rx="10" ry="12" transform="rotate(-15 -18 -8)"/>
    <ellipse cx="-6" cy="-22" rx="9" ry="11"/>
    <ellipse cx="10" cy="-22" rx="9" ry="11"/>
    <ellipse cx="22" cy="-8" rx="10" ry="12" transform="rotate(15 22 -8)"/>
  </g>
  <!-- Search icon -->
  <g transform="translate(130,130)" fill="none" stroke="white" stroke-width="5" stroke-linecap="round">
    <circle cx="0" cy="0" r="14" fill="rgba(255,255,255,0.2)"/>
    <line x1="10" y1="10" x2="22" y2="22"/>
  </g>
</svg>